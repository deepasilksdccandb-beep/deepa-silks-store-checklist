<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Deepa Silks — Store Operations Checklist</title>
<meta name="theme-color" content="#B5122A"/>
<link rel="icon" type="image/png" href="images/deepa-logo.png"/>
<link rel="apple-touch-icon" href="images/deepa-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/theme.css"/>
<style>
  /* One background for the WHOLE page: the gradient is declared on html AND
     body and pinned to the viewport (background-attachment: fixed), so it
     always fills the visible area and no lighter band can appear below it. */
  html, body {
    min-height: 100%;
    min-height: 100dvh;              /* mobile URL bar can't reveal a band */
    background:
      radial-gradient(1100px 500px at 50% -120px, rgba(252, 244, 225, .18), transparent 62%),
      linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);   /* #B5122A major theme */
    background-attachment: fixed;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    overflow-x: hidden; overflow-y: auto;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 16px; margin: auto; }
  .logo-chip {
    width: 118px; height: 132px;
    background: var(--paper);
    border: 2px solid var(--gold-light);
    border-radius: 22px;
    box-shadow: 0 10px 34px rgba(0, 0, 0, .30);
    display: flex; align-items: center; justify-content: center;
    padding: 10px; margin-bottom: 12px;
  }
  .logo-chip img { max-width: 100%; max-height: 100%; object-fit: contain; }
  /* Deepa tagline directly below the logo */
  .login-greet { font-size: 20px; color: #FFF8E7; margin-bottom: 8px; text-align: center; text-shadow: 0 1px 6px rgba(0, 0, 0, .18); }
  .s-name { font-family: var(--font-head); font-size: 24px; color: #FFF8E7; margin-bottom: 4px; text-align: center; }
  .tagline { font-size: 10.5px; color: rgba(252, 244, 225, .85); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 20px; text-align: center; }
  .pin-label { font-size: 10.5px; color: rgba(255, 248, 231, .72); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
  .dots { display: flex; gap: 15px; justify-content: center; margin-bottom: 24px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(252, 244, 225, .55); background: transparent; transition: all .15s; }
  .dot.on { background: var(--gold-light); border-color: var(--gold-light); box-shadow: 0 0 9px rgba(252, 244, 225, .6); }
  .pad { display: grid; grid-template-columns: repeat(3, 68px); gap: 9px; }
  .k {
    width: 68px; height: 68px; border-radius: 14px;
    background: rgba(255, 255, 255, .10);
    border: 1px solid rgba(252, 244, 225, .30);
    color: #FFF8E7; font-size: 21px; font-weight: 600;
    transition: background .1s, transform .08s;
  }
  .k:active { background: rgba(252, 244, 225, .32); transform: scale(.93); }
  .k-del { background: rgba(15, 34, 55, .45); color: #FCF4E1; font-size: 16px; }   /* navy */
  .msg { font-size: 12.5px; min-height: 28px; margin-top: 10px; text-align: center; color: #FFE7B8; font-weight: 600; max-width: 300px; }
  .msg.info { color: rgba(255, 248, 231, .78); font-weight: 400; }
  .go {
    display: block; margin: 16px auto 0; width: 222px; height: 48px;
    border-radius: 12px; background: var(--gold-light); color: var(--maroon);
    font-size: 15px; font-weight: 700; letter-spacing: .05em;
    transition: opacity .15s, transform .08s;
  }
  .go:disabled { opacity: .35; cursor: not-allowed; }
  .go:not(:disabled):active { transform: scale(.98); }
  .loader { display: none; flex-direction: column; align-items: center; gap: 12px; margin-top: 12px; }
  .loader.show { display: flex; }
  .loader .spinner { border-color: rgba(252, 244, 225, .25); border-top-color: var(--gold-light); }
  .load-txt { font-size: 12.5px; color: rgba(255, 248, 231, .75); }
  /* tighter than the shared default so the login fits one screen */
  .cb-footer { margin-top: 16px; }

  /* Short screens (360×640 phones, laptops): tighten every gap and shrink
     the keypad so the whole login fits on ONE screen with no scrollbar. */
  @media (max-height: 700px) {
    .wrap { padding: 12px; }
    .logo-chip { width: 80px; height: 90px; border-radius: 16px; padding: 7px; margin-bottom: 8px; }
    .login-greet { font-size: 17px; margin-bottom: 4px; }
    .s-name { font-size: 20px; margin-bottom: 2px; }
    .tagline { font-size: 9.5px; margin-bottom: 12px; }
    .pin-label { margin-bottom: 8px; }
    .dots { gap: 12px; margin-bottom: 14px; }
    .dot { width: 11px; height: 11px; }
    .pad { grid-template-columns: repeat(3, 56px); gap: 7px; }
    .k { width: 56px; height: 56px; font-size: 17px; border-radius: 12px; }
    .go { height: 42px; margin-top: 12px; font-size: 14px; }
    .msg { min-height: 22px; margin-top: 8px; }
    .loader { margin-top: 8px; }
    .cb-footer { margin-top: 12px; }
    .cb-footer img { height: 28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-chip"><img src="images/deepa-logo.png" alt="Deepa Silks"/></div>
  <div class="deepa-tagline login-greet" lang="ta">தீப வணக்கம்</div>
  <div class="s-name">Deepa Silks</div>
  <div class="tagline">Store Operations Checklist</div>

  <div id="pinSection">
    <div class="pin-label">Enter your PIN</div>
    <div class="dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div class="pad">
      <button class="k" onclick="kp(1)">1</button><button class="k" onclick="kp(2)">2</button><button class="k" onclick="kp(3)">3</button>
      <button class="k" onclick="kp(4)">4</button><button class="k" onclick="kp(5)">5</button><button class="k" onclick="kp(6)">6</button>
      <button class="k" onclick="kp(7)">7</button><button class="k" onclick="kp(8)">8</button><button class="k" onclick="kp(9)">9</button>
      <button class="k" style="visibility:hidden"></button>
      <button class="k" onclick="kp(0)">0</button>
      <button class="k k-del" onclick="kd()">&#9003;</button>
    </div>
    <button class="go" id="goBtn" disabled>&#8629; Sign in</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="cb-footer">
    <img class="cb-logo--onDark" src="images/cb-logo.png" alt="Consulting &amp; Beyond" onerror="this.style.display='none'"/>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="load-txt" id="loadTxt">Verifying...</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var CFG = window.DEEPA_CONFIG || {};
  var PIN_MIN = (CFG.pinLength && CFG.pinLength.min) || 4;
  var PIN_MAX = (CFG.pinLength && CFG.pinLength.max) || 8;
  var pin = '';

  // Already signed in? Go straight to the right page.
  var existing = window.Auth.get();
  if (existing) {
    window.location.replace(existing.isAdmin ? 'dashboard.html' : 'checklist.html');
    return;
  }

  var params = new URLSearchParams(window.location.search);
  var msg = params.get('msg');
  if (msg === 'expired') setMsg('Your session expired. Please sign in again.', '');
  else if (msg === 'signin') setMsg('Please sign in to continue.', 'info');

  function dots() {
    for (var i = 0; i < PIN_MAX; i++) {
      var el = document.getElementById('d' + i);
      if (!el) continue;
      if (i < pin.length) el.classList.add('on'); else el.classList.remove('on');
    }
    var go = document.getElementById('goBtn');
    if (go) go.disabled = pin.length < PIN_MIN;
  }
  function setMsg(t, cls) {
    var el = document.getElementById('msg');
    el.textContent = t;
    el.className = 'msg' + (cls ? ' ' + cls : '');
  }
  window.kp = function (n) {
    if (pin.length >= PIN_MAX) return;
    pin += String(n);
    dots();
    if (pin.length === PIN_MAX) setTimeout(validate, 180);
  };
  window.kd = function () {
    if (!pin.length) return;
    pin = pin.slice(0, -1);
    dots();
    setMsg('', '');
  };
  document.addEventListener('keydown', function (e) {
    if (e.key >= '0' && e.key <= '9') window.kp(+e.key);
    else if (e.key === 'Backspace') window.kd();
    else if (e.key === 'Enter' && pin.length >= PIN_MIN) validate();
  });
  // On-screen submit (phones have no Enter key; PINs may be shorter than PIN_MAX).
  var goBtn = document.getElementById('goBtn');
  if (goBtn) goBtn.addEventListener('click', function () {
    if (pin.length >= PIN_MIN && pin.length <= PIN_MAX) validate();
  });

  function showLoader(txt) {
    document.getElementById('pinSection').style.display = 'none';
    document.getElementById('loader').classList.add('show');
    document.getElementById('loadTxt').textContent = txt || 'Loading...';
  }

  function validate() {
    if (!window.DEEPA_API || !window.DEEPA_API.configured()) {
      setMsg((window.DEEPA_CONFIG && window.DEEPA_CONFIG.apiEndpoint === '__DEEPA_API_ENDPOINT__')
        ? 'App not configured yet — set the API endpoint in js/config.js.'
        : 'App configuration error. Contact support.', '');
      return;
    }
    setMsg('Verifying...', 'info');
    showLoader('Verifying...');
    window.DEEPA_API.post('login', { pin: pin }).then(function (r) {
      if (!r.ok) {
        document.getElementById('loader').classList.remove('show');
        document.getElementById('pinSection').style.display = '';
        setMsg(r.error || 'Invalid PIN. Please try again.');
        pin = '';
        dots();
        return;
      }
      window.Auth.save({
        token: r.token,
        name: r.name,
        role: r.role,
        isAdmin: !!r.isAdmin,
        exp: Date.now() + ((r.expiresInMin || 480) - 5) * 60000
      });
      showLoader('Welcome, ' + r.name + '...');
      window.location.href = r.isAdmin ? 'dashboard.html' : 'checklist.html';
    });
  }
})();
</script>
</body>
</html>
